<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de RPG & Fichas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gerenciador de Fichas & Dados</h1>
        <div id="user-section">
            <a href="/auth/discord" id="login-btn">Entrar com Discord</a>
        </div>
    </header>

    <main id="app" style="display: none;">
        <section class="card">
            <h2>Criar Personagem</h2>
            <form id="char-form">
                <input type="text" id="char-name" placeholder="Nome do Personagem" required>
                <input type="text" id="char-class" placeholder="Classe" required>
                
                <div class="attributes-grid">
                    <label>Força: <input type="number" id="attr-str" value="10" min="1" max="20" required></label>
                    <label>Destreza: <input type="number" id="attr-dex" value="10" min="1" max="20" required></label>
                    <label>Constituição: <input type="number" id="attr-con" value="10" min="1" max="20" required></label>
                    <label>Inteligência: <input type="number" id="attr-int" value="10" min="1" max="20" required></label>
                    <label>Sabedoria: <input type="number" id="attr-wis" value="10" min="1" max="20" required></label>
                    <label>Carisma: <input type="number" id="attr-cha" value="10" min="1" max="20" required></label>
                </div>
                <button type="submit">Salvar Ficha</button>
            </form>
        </section>

        <section class="card">
            <h2>Simulador de Dados Poliédricos (Auditado)</h2>
            <div class="dice-buttons">
                <button onclick="rollDice('d4')">D4</button>
                <button onclick="rollDice('d6')">D6</button>
                <button onclick="rollDice('d8')">D8</button>
                <button onclick="rollDice('d10')">D10</button>
                <button onclick="rollDice('d12')">D12</button>
                <button onclick="rollDice('d20')">D20</button>
            </div>
            <div id="roll-result"></div>
        </section>
    </main>

    <footer>
        <p>Chave de Acesso: P26-2B-BE2F-719D-E492-008C</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
